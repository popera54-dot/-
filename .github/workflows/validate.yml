name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all Python sources
        run: python -m py_compile main.py stage4_puzzle.py stage5_tasks.py stage6_protocol.py stage7_server_cipher.py later_stages.py puzzle_checks.py

      - name: Run fixed-value puzzle checks
        run: python puzzle_checks.py
